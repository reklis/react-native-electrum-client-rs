[package]
name = "react-native-electrum-client-rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "electrum_client_rs"

[[bin]]
name = "generate_bindings"
path = "bin/generate_bindings.rs"

[dependencies]
uniffi = "0.29.4"
uniffi_bindgen = "0.29.4"
tokio = { version = "1.42", features = ["full"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
lazy_static = "1.4"
camino = "1.2"

[build-dependencies]
uniffi = { version = "0.29.4", features = ["build"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
